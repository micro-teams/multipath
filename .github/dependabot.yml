# Keeps third-party dependencies current. Weekly, and minor and patch releases of one ecosystem
# arrive together as one pull request; a major release comes on its own, because it is the one that
# can break the build.
version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/go'
    schedule:
      interval: 'weekly'
    groups:
      go-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/ts'
    schedule:
      interval: 'weekly'
    groups:
      ts-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
