name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

# One workflow, following the microteams convention: every part of the repository is checked in
# parallel, and publishing hangs off the same run rather than off a second workflow that could
# disagree with it about whether the code was any good.
#
#   go / ts / dart / jvm   check each package on its own, because each is released on its own
#   e2e                     the whole substrate over the wire: a real JVM origin, every client (Go,
#                           browser, Dart), and a per-link fault middlebox cutting links underneath —
#                           the job that decides whether MultiPath works, not just whether it compiles
#   publish-*               only after all five are green
#
# Nothing here depends on anything outside this repository: no consumer application, no database,
# no external service.

permissions:
  contents: read
  packages: write

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - run: gofmt -l . | tee /tmp/unformatted && [ ! -s /tmp/unformatted ]
      - run: go vet ./...
      - run: go build ./...
      # -race, because the redundant stream and the mux are written by several goroutines at once; a
      # data race there would surface as an occasional lost byte, the kind of bug blamed on the
      # network for weeks. The cross-language legs are skipped here (no JVM classpath) and run in e2e.
      - run: go test -race -skip XLang ./...

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      # The cross-language legs skip here (no JVM classpath) and run in e2e; this is the unit level.
      - run: npm test

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # The cross-language leg skips without a JVM classpath and runs in e2e; this is the unit level.
      - run: dart test test/codecs_test.dart

  jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: jvm/pom.xml
      - run: ./mvnw -B verify
      # spotless runs as part of the build, so a formatting mistake shows up as a dirty tree rather
      # than as a separate check that can disagree with the build.
      - name: Check formatting was applied
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            git diff
            echo "Uncommitted changes: run './mvnw spotless:apply' in jvm/ and commit."
            exit 1
          fi

  # The substrate is proven the only way that matters: a real JVM origin process and a real Go
  # client, driving both routed paths (a tunnel and a normal HTTP exchange) across a per-link fault
  # middlebox that black-holes, one-directionally cuts, and hard-disconnects links. Compiling both
  # halves proves nothing about whether they interoperate on the wire under loss; this job does.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: jvm/pom.xml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build the origin and run the cross-language substrate e2e
        run: ./testbed/run.sh

  # ---------------------------------------------------------------------------------------------
  # Publishing. Two shapes, one workflow.
  #
  #   a branch build  ->  a moving pointer that tracks that branch, for consumers who want to
  #                       develop against unreleased work
  #   a v* tag        ->  an immutable release
  #
  # Go needs no publishing step at all: `go get github.com/micro-teams/multipath/go@<ref>` resolves
  # straight from the commit. The JVM (Maven) and browser (npm) packages are pushed to registries.
  # ---------------------------------------------------------------------------------------------

  publish-branch:
    needs: [go, ts, dart, jvm, e2e]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@micro-teams"
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: jvm/pom.xml
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Derive the branch label
        id: label
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/_' '--' | tr -cd '[:alnum:]-')" >> "$GITHUB_OUTPUT"

      # npm refuses to replace a version, so a branch build gets a unique prerelease number and the
      # *dist-tag* is the moving pointer: install @micro-teams/multipath@<branch> for the newest.
      - name: Publish the browser package
        working-directory: ts
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          version="${base}-${{ steps.label.outputs.value }}.${{ github.run_number }}"
          npm ci
          npm run build
          npm version "$version" --no-git-tag-version
          npm publish --tag "${{ steps.label.outputs.value }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A -SNAPSHOT version is expected to be replaced, and resolvers re-check it, so the branch
      # label goes in the version and the snapshot suffix does the rest — no per-run number, no
      # accumulating garbage. The bump is never committed; the version in git stays the release one.
      - name: Publish the JVM package
        working-directory: jvm
        run: |
          set -euo pipefail
          base="$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          version="${base%-SNAPSHOT}-${{ steps.label.outputs.value }}-SNAPSHOT"
          ./mvnw -B versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
          ./mvnw -B deploy -DskipTests
          echo "published app.microteams:multipath:$version"
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Go needs no registry
        run: echo 'go get github.com/micro-teams/multipath/go@${{ github.ref_name }}'

  publish-release:
    needs: [go, ts, dart, jvm, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@micro-teams"
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: jvm/pom.xml
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # A tag that disagrees with either committed version would publish a release nobody asked for,
      # and an npm version cannot be replaced once taken — so this comes before any publish.
      - name: Check the tag matches both committed versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pom="$(cd jvm && ./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          pkg="$(node -p "require('./ts/package.json').version")"
          [[ "$tag" == "$pom" ]] || { echo "tag $tag != jvm/pom.xml $pom" >&2; exit 1; }
          [[ "$tag" == "$pkg" ]] || { echo "tag $tag != ts/package.json $pkg" >&2; exit 1; }

      - name: Publish the browser package
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the JVM package
        working-directory: jvm
        run: ./mvnw -B deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
