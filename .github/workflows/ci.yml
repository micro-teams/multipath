# Continuous integration: every part of the repository is checked in parallel on pull requests, on
# main, and on release tags.
#
#   go           formatting, vet, build, and the unit tests under the race detector
#   js           the JavaScript package: formatting, lint, build, and the unit tests
#   conformance  the real server with the Go client, the JavaScript client in Node and in Chromium,
#                through the fault proxy and the attack scenarios, with production timeouts: the
#                job that decides whether MultiPath works
#   release      on a v* tag only: the tag agrees with every committed version, then the JavaScript
#                package is published to GitHub Packages. Nothing is published from a branch. Go
#                needs no publishing, since the tag is what `go get` resolves.
#
# Nothing here depends on anything outside this repository.

name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - name: Formatting
        run: |
          unformatted="$(gofmt -l go conformance)"
          if [ -n "$unformatted" ]; then echo "run gofmt -w on: $unformatted"; exit 1; fi
      - run: go vet ./...
        working-directory: go
      - run: go vet ./...
        working-directory: conformance
      - run: go build ./...
        working-directory: go
      # The session, mux and links are driven by several goroutines at once; a data race there
      # would surface as an occasional lost byte.
      - run: go test -race -count=1 ./...
        working-directory: go

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      - run: npx playwright install --with-deps chromium
        working-directory: js
      - run: conformance/run.sh
        env:
          MP_BROWSER: "1"

  release:
    needs: [go, js, conformance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: js/package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@micro-teams"
      # An npm version cannot be replaced once published, so a tag that disagrees with any committed
      # version stops here, before anything is published.
      - name: Check the tag matches every committed version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          scripts/version.sh
          file="$(tr -d '[:space:]' < VERSION)"
          [[ "$tag" == "$file" ]] || { echo "tag $tag != VERSION $file" >&2; exit 1; }
          echo "tag $tag agrees with every committed version"
      - name: Publish the JavaScript package
        working-directory: js
        run: |
          npm ci
          npm run build
          # A version with a pre-release part (0.3.0-rc.1) is published under the next tag, so that
          # latest keeps pointing at the newest final release; npm refuses a pre-release without a tag.
          case "$(node -p "require('./package.json').version")" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
