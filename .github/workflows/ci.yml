# Continuous integration: every part of the repository is checked in parallel on pull requests, on
# main, and on release tags.
#
#   go           formatting, vet, build, and the unit tests under the race detector
#   conformance  the real server and client binaries through the fault proxy and the attack
#                scenarios, with production timeouts: the job that decides whether MultiPath works
#   js           the legacy protocol-version-2 browser package still builds and passes its tests
#   release      on a v* tag only: the tag agrees with VERSION and the Go implementation version.
#                Go needs no publishing, since the tag is what `go get` resolves.
#
# Nothing here depends on anything outside this repository.

name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - name: Formatting
        run: |
          unformatted="$(gofmt -l go conformance)"
          if [ -n "$unformatted" ]; then echo "run gofmt -w on: $unformatted"; exit 1; fi
      - run: go vet ./...
        working-directory: go
      - run: go vet ./...
        working-directory: conformance
      - run: go build ./...
        working-directory: go
      # The session, mux and links are driven by several goroutines at once; a data race there
      # would surface as an occasional lost byte.
      - run: go test -race -count=1 ./...
        working-directory: go

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - run: conformance/run.sh

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      # The cross-language tests need a version-2 origin, which this repository does not build;
      # they skip without one, and the unit tests run.
      - run: npm test

  release:
    needs: [go, conformance, js]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches every committed version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          impl="$(sed -n 's/^const ImplVersion = "\(.*\)"$/\1/p' go/protocol/version.go)"
          for pair in "VERSION:$file" "go/protocol/version.go:$impl"; do
            [[ "$tag" == "${pair#*:}" ]] || { echo "tag $tag != ${pair%%:*} ${pair#*:}" >&2; exit 1; }
          done
          echo "tag $tag agrees with VERSION and the Go implementation version"
