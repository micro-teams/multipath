name: multipath_testbed_dart
description: The Dart line manager exercised against the running testbed, over real sockets.
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # A path dependency on purpose: this must exercise the source in this repository, not a published
  # copy of it, or a regression could reach a release before anything here noticed.
  multipath:
    path: ../../dart

dev_dependencies:
  lints: ^5.0.0
